name: Build DKLA release
on:
  push:
    branches:
      - codex/cold-call-v24
      - codex/v2.5-hotfix
      - claude/atlas-design-content-audit-m1cw9x
    paths:
      - tools/cold-call/**
      - tools/r19/**
      - tools/v25/**
      - tools/atlas.py
      - .github/workflows/cold-call.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cold-call-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DKLA-r18.html
            /tools/r19/
            /tools/cold-call/
            /tools/v25/
            /tools/atlas.py
            /added-sources/opinions/lrs-s-chadha.txt
            /index.html
            /vercel.json
            /version.json
            /sw.js
      - name: Build and validate
        run: |
          python3 tools/r19/assemble.py
          python3 tools/r19/check.py
          python3 tools/v25/authorities_build.py --check
          python3 tools/v25/uscode_build.py --check
          python3 tools/v25/check_timeline_audit.py --json
          python3 tools/v25/explanation_inventory.py --check
          node tools/v25/authorities_check.cjs
          node tools/v25/reading_check.cjs
          node tools/cold-call/check_reader.cjs
          python3 tools/cold-call/check_index.py
          python3 tools/cold-call/check_narratives.py --write
          python3 tools/r19/audit24.py
      - name: Require complete production narrative coverage
        if: github.ref_name == 'claude/atlas-design-content-audit-m1cw9x'
        run: python3 tools/cold-call/check_narratives.py --require-complete
      - name: Commit generated release
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          RELEASE_FILE="$(python3 -c 'import json; print(json.load(open("version.json"))["file"])')"
          git add --sparse "$RELEASE_FILE" index.html vercel.json version.json sw.js tools/r19/integrity.json tools/r19/data/accuracy24-inventory.json tools/cold-call/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Build $RELEASE_FILE release"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
