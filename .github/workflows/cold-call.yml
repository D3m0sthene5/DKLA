name: Check DKLA release
on:
  push:
    branches:
      - codex/v2.6-release
      - claude/atlas-design-content-audit-m1cw9x
    paths: ['src/**', 'tools/**', 'api/**', 'lib/**', 'assets/**', 'package.json', 'pnpm-lock.yaml', 'vercel.json', '.github/workflows/cold-call.yml']
  pull_request:
    paths: ['src/**', 'tools/**', 'api/**', 'lib/**', 'assets/**', 'package.json', 'pnpm-lock.yaml', 'vercel.json', '.github/workflows/cold-call.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - name: Build and check current source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check
          pnpm check:v26
          pnpm check:analytics
          pnpm test:analytics
          python3 tools/v25/authorities_build.py --check
          python3 tools/v25/uscode_build.py --check
          python3 tools/v25/check_timeline_audit.py --json
          python3 tools/v25/explanation_inventory.py --check
          python3 tools/v25/generated_rule_connections_check.py
          node tools/v25/generated_rule_connections_check.cjs
          python3 tools/v25/check_practice_filter.py
          python3 tools/v25/geography_check.py --check
          python3 tools/cold-call/check_index.py
          python3 tools/cold-call/check_narratives.py --require-complete
          python3 tools/cold-call/check_main_audit.py
      - name: Check native Home against generated public output
        run: |
          pnpm exec playwright install --with-deps chromium
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist >/tmp/dkla-home-server.log 2>&1 &
          DKLA_SERVER_PID=$!
          trap 'kill "$DKLA_SERVER_PID"' EXIT
          DKLA_HOME_TEST_URL=http://127.0.0.1:4321/DKLA-v2.6.html pnpm run test:home -- --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-home-screenshots-and-bounds
          path: test-results/
