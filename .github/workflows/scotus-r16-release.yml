name: DKLA r16 Release
on:
  push:
    branches: [feature/scotus-history-r16]
    paths: ['.github/workflows/scotus-r16-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 rapidfuzz pillow numpy scipy
      - name: Build checked additive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          if test -d scotus-r16/transport; then
            python -u scotus-r16/bootstrap.py
          else
            python -u scotus-r16/assemble.py
            cp DKLA-r16.html output/
            cp scotus-r16/integrity.json output/
          fi
      - name: Commit release on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DKLA-r16.html scotus-r16
          if ! git diff --cached --quiet; then
            git commit -m 'Publish DKLA r16: source-backed SCOTUS history, timeline, portraits and subtle theme polish'
            git push origin HEAD:feature/scotus-history-r16
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dkla-r16-release
          path: output/
          retention-days: 14
