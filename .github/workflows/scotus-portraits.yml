name: Authentic SCOTUS Portrait Assets
on:
  push:
    branches: [assets/scotus-authentic-portraits-2026-09-27]
    paths: ['.github/workflows/scotus-portraits.yml', 'portrait-build/**']
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: portrait-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging dependencies
        run: pip install requests beautifulsoup4 pillow numpy 'rembg[cpu]' reportlab
      - name: Build or test network
        run: |
          mkdir -p output
          if test -f portrait-build/build.py; then
            python -u portrait-build/build.py
          else
            python - <<'PY'
          import requests,json,pathlib
          out=[]
          for url in ['https://www.supremecourt.gov/about/biographies.aspx','https://en.wikipedia.org/wiki/John_Jay','https://commons.wikimedia.org/w/api.php?action=query&format=json&titles=File:John%20Roberts%20Official%20SCOTUS%20Portrait.jpg&prop=imageinfo&iiprop=url','https://supremecourthistory.org/wp-content/uploads/2022/10/supreme-court-portrait-2022.jpg']:
            try:
              r=requests.get(url,timeout=30);out.append({'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')});print(out[-1])
              if r.ok and r.headers.get('content-type','').startswith('image/'):pathlib.Path('output/network-proof.jpg').write_bytes(r.content)
            except Exception as e:out.append({'url':url,'error':str(e)})
          pathlib.Path('output/network-proof.json').write_text(json.dumps(out,indent=2))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scotus-authentic-portraits
          path: output/
          retention-days: 14
