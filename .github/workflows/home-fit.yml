name: Check native Atlas home
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Explicit preview URL to check; does not deploy or modify it
        required: true
        type: string
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:home
        env:
          DKLA_HOME_TEST_URL: ${{ inputs.preview_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-home-screenshots-and-bounds
          path: test-results/
