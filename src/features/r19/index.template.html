<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DKLA · Danny Kind Legal Atlas</title>
<script>/* The site root forwards to the atlas file. An offline worker from v2.9 or earlier may also have stored this page as its offline atlas, and then serves it at other addresses too: online at an old address (whose redirect it cannot follow) and offline at any address. So the page forwards from every address except the atlas file itself. An old address reaches the real page when online; offline it stops after one hop, at the atlas file, instead of opening this page forever. There it waits for the connection, or for this release's offline worker to take over (then the same address opens the atlas). With JavaScript off there is no automatic forward (a meta refresh cannot tell the addresses apart), only the link below. */
if (!location.pathname.endsWith('/DKLA-v2.5.html')) location.replace('DKLA-v2.5.html' + location.search + location.hash);
else {
  document.documentElement.className = 'dkla-offline-pending';
  addEventListener('online', () => location.reload(), { once: true });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
    if (navigator.onLine) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}</script>
